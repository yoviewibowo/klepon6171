        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

      const value = String(url).trim();

      if (!value) return "#";

      try {

      return function (...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), delay);

    }

              <span class="big">⌕</span>
              Ketik kata kunci untuk mulai mencari.
            </div>
          </div>`;

        return;
      }

      let filtered = data.filter(d =>
        (d.nmsls || "").toLowerCase().includes(keyword) ||
        (d.nmkelurahan || "").toLowerCase().includes(keyword) ||
        (d.nmkec || "").toLowerCase().includes(keyword) ||
        (d.idsls || "").toLowerCase().includes(keyword) ||
        (d.idsubsls || "").toLowerCase().includes(keyword)
      );

      filtered.sort((a, b) => {
        const score = (d) => {
          const idsls = (d.idsls || "").toLowerCase();
          const idsubsls = (d.idsubsls || "").toLowerCase();
          const nmsls = (d.nmsls || "").toLowerCase();

          if (idsls === keyword || idsubsls === keyword) return 4;
          if (idsls.startsWith(keyword) || idsubsls.startsWith(keyword)) return 3;
          if (nmsls.startsWith(keyword)) return 2;

          return 1;
        };

        return score(b) - score(a);
      });

      statusLabel.textContent = filtered.length ? "Hasil pencarian" : "Tidak ditemukan";
      resultCount.textContent = filtered.length + " hasil";

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <div>
              <span class="big">◌</span>
              Data tidak ditemukan 😢
            </div>
          </div>`;

        return;
      }

      container.innerHTML = filtered.map(d => {
        const mapURL = safeURL(d.linkpeta || "");
        const locURL = safeURL(d.linklokasi || "");

        const mapDisabled = mapURL === "#" ? " disabled" : "";
        const locDisabled = locURL === "#" ? " disabled" : "";

        return `
          <article class="result-card">
            <div class="result-title">
              ${escapeHTML(d.nmsls || "-")}
            </div>

            <div class="result-sub">
              ${escapeHTML(d.nmkelurahan || "-")} • ${escapeHTML(d.nmkec || "-")}
            </div>

            <div class="id-row">
              <span class="chip">SLS ${escapeHTML(d.idsls || "-")}</span>
              <span class="chip">SubSLS ${escapeHTML(d.idsubsls || "-")}</span>
            </div>

            <div class="buttons">
              <a
                href="${mapURL}"
                target="_blank"
                rel="noopener"
                class="map-btn${mapDisabled}"
              >
                Lihat Peta ↗
              </a>

              <a
                href="${locURL}"
                target="_blank"
                rel="noopener"
                class="loc-btn${locDisabled}"
              >
                Google Maps ↗
              </a>
            </div>
          </article>`;
      }).join("");
    }, 260);

    input.addEventListener("input", handleSearch);

    // ================= ENTRANCE =================
    gsap.from(".brand", {
      opacity:0,
      y:-14,
      duration:.7,
      ease:"power2.out"
    });

    gsap.from(".search-panel", {
      opacity:0,
      x:44,
      duration:1,
      delay:.18,
      ease:"power3.out"
    });

    gsap.from(".visual-wordmark", {
      opacity:0,
      y:18,
      duration:.8,
      delay:.42,
      ease:"power2.out"
    });

    gsap.from(".klepon", {
      opacity:0,
      scale:.2,
      y:55,
      rotation:() => gsap.utils.random(-28,28),
      duration:1.12,
      delay:.12,
      stagger:.09,
      ease:"back.out(1.7)"
    });

    // ================= FLOATING KLEPON =================
    document.querySelectorAll(".klepon").forEach((el, i) => {
      gsap.to(el, {
        y:i % 2 ? -15 : 17,
        x:i % 3 === 0 ? 8 : -5,
        rotation:i % 2 ? 5 : -5,
        duration:3.7 + i * .42,
        repeat:-1,
        yoyo:true,
        ease:"sine.inOut"
      });
    });

    document.querySelectorAll(".leaf").forEach((el, i) => {
      gsap.to(el, {
        y:i % 2 ? 19 : -21,
        x:i % 2 ? -13 : 14,
        rotation:"+=" + (i % 2 ? 17 : -14),
        duration:5.8 + i,
        repeat:-1,
        yoyo:true,
        ease:"sine.inOut"
      });
    });

    // ================= POINTER PARALLAX =================
    const stack = document.getElementById("kleponStack");

    let mx = 0;
    let my = 0;
    let cx = 0;
    let cy = 0;

    window.addEventListener("pointermove", e => {
      mx = e.clientX / innerWidth - .5;
      my = e.clientY / innerHeight - .5;
    });

    function animateParallax(){
      cx += (mx - cx) * .055;
      cy += (my - cy) * .055;

      stack.style.transform =
        `translate3d(${cx * 30}px, ${cy * 22}px, 0) rotate(${-4 + cx * 7}deg)`;

      requestAnimationFrame(animateParallax);
    }

    animateParallax();

    // ================= COCONUT PARTICLES =================
    const crumbs = document.getElementById("crumbs");

    function createCrumb(){
      const c = document.createElement("span");

      c.className = "crumb";

      const w = Math.random() * 6 + 2;
      const h = Math.random() * 2.5 + 1.3;

      c.style.width = w + "px";
      c.style.height = h + "px";
      c.style.left = Math.random() * 100 + "%";
      c.style.opacity = Math.random() * .20 + .09;
      c.style.animationDuration = (Math.random() * 7 + 7) + "s";

      crumbs.appendChild(c);

      setTimeout(() => c.remove(), 14500);
    }

    setInterval(createCrumb, 470);
  </script>
</body>
</html>
